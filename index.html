<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f172a" />
    <title>Dneprfilm — відеопродакшн і прямі трансляції</title>
    <meta name="description" content="Відеопродакшн повного циклу, багатокамерні прямі трансляції, фотографія та медіасупровід будівництва в Україні." />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta property="og:title" content="Dneprfilm — відеопродакшн і прямі трансляції" />
    <meta property="og:description" content="Відеопродакшн повного циклу, багатокамерні прямі трансляції, фотографія та медіасупровід будівництва в Україні." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Dneprfilm" />
    <meta property="og:locale" content="uk_UA" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Dneprfilm — відеопродакшн і прямі трансляції" />
    <meta name="twitter:description" content="Відеопродакшн повного циклу, багатокамерні прямі трансляції, фотографія та медіасупровід будівництва в Україні." />
    <script>
      (() => {
        const recoveryKey = 'dneprfilm_asset_reload';

        const showBootError = (details = '') => {
          const fallback = document.getElementById('boot-fallback');
          if (!fallback) return;
          const safeDetails = String(details)
            .replaceAll('&', '&amp;')
            .replaceAll('<', '&lt;')
            .replaceAll('>', '&gt;')
            .replaceAll('"', '&quot;')
            .replaceAll("'", '&#039;');
          fallback.innerHTML = '<div style="max-width:760px">' +
            '<strong style="display:block;margin-bottom:10px;color:#fff">Не вдалося запустити сайт</strong>' +
            '<span>Оновіть сторінку або натисніть Ctrl+F5.</span>' +
            (safeDetails ? '<code style="display:block;margin-top:16px;padding:12px;border-radius:8px;background:#0f172a;color:#fca5a5;text-align:left;white-space:pre-wrap;word-break:break-word">' + safeDetails + '</code>' : '') +
            '</div>';
        };

        const recover = () => {
          let lastAttempt = 0;
          try {
            lastAttempt = Number(sessionStorage.getItem(recoveryKey) || '0');
          } catch {
            // ignore storage errors
          }

          const now = Date.now();
          if (lastAttempt && now - lastAttempt < 15000) {
            showBootError('Повторна помилка завантаження JS/CSS після автоматичного оновлення.');
            return;
          }

          try {
            sessionStorage.setItem(recoveryKey, String(now));
          } catch {
            // ignore storage errors
          }

          const next = new URL(window.location.href);
          next.searchParams.set('_refresh', String(now));
          window.location.replace(next.toString());
        };

        window.addEventListener('vite:preloadError', (event) => {
          event.preventDefault();
          recover();
        });

        window.addEventListener('error', (event) => {
          const target = event.target;
          if (target instanceof HTMLScriptElement || target instanceof HTMLLinkElement) {
            const url = target instanceof HTMLScriptElement ? target.src : target.href;
            if (url && url.includes('/assets/')) {
              recover();
              return;
            }
          }

          if (event instanceof ErrorEvent && event.message) {
            showBootError(event.message);
          }
        }, true);

        window.addEventListener('unhandledrejection', (event) => {
          const message = String(event.reason?.message || event.reason || '');
          if (
            message.includes('Failed to fetch dynamically imported module') ||
            message.includes('Importing a module script failed') ||
            message.includes('Unable to preload CSS')
          ) {
            event.preventDefault();
            recover();
            return;
          }

          if (message) showBootError(message);
        });

        window.setTimeout(() => {
          if (document.getElementById('boot-fallback')) {
            showBootError('JavaScript не завершив запуск протягом 10 секунд.');
          }
        }, 10000);
      })();
    </script>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;background:#020617;color:#cbd5e1;font:16px/1.6 system-ui,sans-serif;text-align:center">
        Завантаження Dneprfilm…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
