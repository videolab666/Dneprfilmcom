name: Apply public locale cleanup

on:
  push:
    branches:
      - feature/complete-en-ui
    paths:
      - scripts/disable_incomplete_public_en.py
      - .github/workflows/apply-public-locale-cleanup.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/complete-en-ui

      - name: Disable incomplete public EN locale
        run: python3 scripts/disable_incomplete_public_en.py

      - name: Remove one-time migration files
        run: |
          rm scripts/disable_incomplete_public_en.py
          rm .github/workflows/apply-public-locale-cleanup.yml

      - name: Commit locale cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Hide incomplete public English locale"
          git push
