name: Apply Full Page Editing 3.0

on:
  push:
    branches:
      - feature/full-page-editing-3
    paths:
      - '.github/workflows/apply-full-page-editing-3.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/full-page-editing-3
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply source migration
        run: python3 scripts/apply-full-page-editing-3.py

      - name: Generate editable copy catalog
        run: bun scripts/generate-editable-copy-catalog.ts

      - name: Type check
        run: bun run lint

      - name: Production build
        run: bun run build
        env:
          SITE_URL: https://videolab666.github.io/Dneprfilmcom
          VITE_SITE_URL: https://videolab666.github.io/Dneprfilmcom
          VITE_BASE_PATH: /Dneprfilmcom/

      - name: Remove one-shot migration files
        run: rm -f scripts/apply-full-page-editing-3.py .github/workflows/apply-full-page-editing-3.yml

      - name: Commit generated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Implement Full Page Editing 3.0"
          git push origin HEAD:feature/full-page-editing-3
