name: One-time patch portfolio fallback rendering

on:
  push:
    branches:
      - feature/full-case-media-portfolio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/full-case-media-portfolio
      - name: Render bundled cases immediately
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/pages/Cases.tsx')
          text = path.read_text()
          text = text.replace("  const [loading, setLoading] = useState(true);\n", "")
          text = text.replace("      setLoading(false);\n", "")
          old = '''          {loading ? (\n            <div className="flex min-h-64 items-center justify-center"><div className="h-8 w-8 animate-spin rounded-full border-2 border-slate-200 border-b-indigo-600" /></div>\n          ) : filteredCases.length === 0 ? ('''
          new = '''          {filteredCases.length === 0 ? ('''
          if old not in text:
              raise SystemExit('Expected loading block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/Cases.tsx
          git commit -m "Render portfolio fallback immediately"
          git push origin HEAD:feature/full-case-media-portfolio
