name: One-time Cloudinary case media migration

on:
  push:
    branches:
      - feature/cloudinary-case-media

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/cloudinary-case-media

      - name: Patch portfolio media layer
        run: |
          python3 - <<'PY'
          from pathlib import Path

          media = Path('src/lib/mediaUpload.ts')
          media.write_text(r'''const CLOUDINARY_CLOUD_NAME = 'n6l9imb7';
          const CLOUDINARY_UPLOAD_PRESET = '123123';
          const MAX_SOURCE_BYTES = 25 * 1024 * 1024;
          const MAX_EDGE = 2400;
          const WEBP_QUALITY = 0.88;

          interface CloudinaryUploadResponse {
            secure_url?: string;
            public_id?: string;
            error?: { message?: string };
          }

          function sanitizeName(name: string): string {
            return name
              .replace(/\.[^.]+$/, '')
              .toLowerCase()
              .replace(/[^a-z0-9_-]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 70) || 'image';
          }

          async function loadBitmap(file: File): Promise<ImageBitmap> {
            if ('createImageBitmap' in window) return createImageBitmap(file);
            throw new Error('Этот браузер не поддерживает подготовку изображений для загрузки.');
          }

          async function optimizeImage(file: File): Promise<Blob> {
            if (!file.type.startsWith('image/')) throw new Error('Можно загружать только изображения.');
            if (file.size > MAX_SOURCE_BYTES) throw new Error('Исходное изображение больше 25 МБ.');

            const bitmap = await loadBitmap(file);
            const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
            const width = Math.max(1, Math.round(bitmap.width * scale));
            const height = Math.max(1, Math.round(bitmap.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            if (!context) {
              bitmap.close();
              throw new Error('Не удалось подготовить изображение.');
            }
            context.drawImage(bitmap, 0, 0, width, height);
            bitmap.close();

            const blob = await new Promise<Blob | null>(resolve => canvas.toBlob(resolve, 'image/webp', WEBP_QUALITY));
            if (!blob) throw new Error('Не удалось сжать изображение.');
            return blob;
          }

          export async function uploadCaseImage(file: File, caseId: string): Promise<{ url: string; publicId: string }> {
            const optimized = await optimizeImage(file);
            const formData = new FormData();
            formData.append('file', optimized, `${sanitizeName(file.name)}.webp`);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('folder', `dneprfilm/cases/${sanitizeName(caseId)}`);
            formData.append('filename_override', `${sanitizeName(file.name)}.webp`);

            const response = await fetch(
              `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
              { method: 'POST', body: formData },
            );
            const data = await response.json() as CloudinaryUploadResponse;

            if (!response.ok || !data.secure_url || !data.public_id) {
              throw new Error(data.error?.message || `Cloudinary upload failed (${response.status}).`);
            }

            return { url: data.secure_url, publicId: data.public_id };
          }
          '''.replace('          ', ''))

          firebase = Path('src/lib/firebase.ts')
          text = firebase.read_text()
          text = text.replace("import { getStorage } from 'firebase/storage';\n", '')
          text = text.replace("export const storage = getStorage(app, `gs://${firebaseConfig.storageBucket}`);\n", '')
          firebase.write_text(text)

          types = Path('src/types.ts')
          text = types.read_text()
          text = text.replace("  storagePath?: string;\n", "  storagePath?: string; // legacy Firebase Storage path\n  cloudinaryPublicId?: string;\n")
          types.write_text(text)

          cases = Path('src/components/admin/CasesManager.tsx')
          text = cases.read_text()
          text = text.replace("import { deleteCaseImage, uploadCaseImage } from '../../lib/mediaUpload';", "import { uploadCaseImage } from '../../lib/mediaUpload';")
          text = text.replace("  const [pendingDeletePaths, setPendingDeletePaths] = useState<string[]>([]);\n  const [newUploadPaths, setNewUploadPaths] = useState<string[]>([]);\n", '')
          text = text.replace("    setPendingDeletePaths([]);\n    setNewUploadPaths([]);\n", '')
          old_cancel = """  const cancelEditing = async () => {\n    const orphaned = Array.from(new Set<string>(newUploadPaths));\n    if (orphaned.length) await Promise.all(orphaned.map((path: string) => deleteCaseImage(path)));\n    setNewUploadPaths([]);\n    setPendingDeletePaths([]);\n    setEditing(null);\n  };\n"""
          new_cancel = """  const cancelEditing = () => {\n    setEditing(null);\n  };\n"""
          if old_cancel not in text:
            raise SystemExit('cancelEditing block not found')
          text = text.replace(old_cancel, new_cancel)
          text = text.replace("        setNewUploadPaths(paths => [...paths, uploaded.storagePath]);\n", '')
          text = text.replace("          storagePath: uploaded.storagePath,\n", "          cloudinaryPublicId: uploaded.publicId,\n")
          text = text.replace("    if (item.storagePath) setPendingDeletePaths(paths => [...paths, item.storagePath!]);\n", '')
          old_cleanup = """      const referencedPaths = new Set<string>(\n        cleanedMedia\n          .map(item => item.storagePath)\n          .filter((path): path is string => Boolean(path))\n      );\n      const orphanedUploads = newUploadPaths.filter(path => !referencedPaths.has(path));\n      const pathsToDelete = [...new Set([...pendingDeletePaths, ...orphanedUploads])];\n      await Promise.all(pathsToDelete.map(path => deleteCaseImage(path)));\n      setPendingDeletePaths([]);\n      setNewUploadPaths([]);\n"""
          if old_cleanup not in text:
            raise SystemExit('save cleanup block not found')
          text = text.replace(old_cleanup, '')
          old_delete = """      const paths = (item.media || []).map(mediaItem => mediaItem.storagePath).filter(Boolean) as string[];\n      await Promise.all(paths.map(path => deleteCaseImage(path)));\n"""
          if old_delete not in text:
            raise SystemExit('case delete cleanup block not found')
          text = text.replace(old_delete, '')
          text = text.replace('Фото загружаются в Firebase Storage', 'Фото загружаются в Cloudinary CDN')
          text = text.replace('onClick={() => void cancelEditing()}', 'onClick={cancelEditing}')
          cases.write_text(text)

          Path('firebase.json').write_text('''{\n  "firestore": [\n    {\n      "database": "ai-studio-2b172e30-4fd3-4131-ba5b-61712d198b9e",\n      "rules": "firestore.rules"\n    }\n  ]\n}\n''')

          for obsolete in ('storage.rules', 'scripts/test-storage-rules.mjs'):
            p = Path(obsolete)
            if p.exists():
              p.unlink()
          PY

      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A src firebase.json storage.rules scripts/test-storage-rules.mjs
          git commit -m "Migrate case image uploads to Cloudinary"
          git push origin HEAD:feature/cloudinary-case-media
