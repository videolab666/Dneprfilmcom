name: Apply page copy CMS migration

on:
  push:
    branches:
      - feature/complete-page-cms
    paths:
      - '.github/workflows/apply-page-copy-cms.yml'

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/complete-page-cms
          fetch-depth: 0

      - name: Apply page copy CMS transformation
        run: node scripts/apply-page-copy-cms.mjs

      - name: Commit transformed pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Connect page copy and FAQ content to CMS"
          git push origin HEAD:feature/complete-page-cms
