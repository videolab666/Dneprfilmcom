name: Harden CMS Platform 4.0

on:
  push:
    branches:
      - feature/cms-platform-4
    paths:
      - scripts/harden-cms-platform-4.py
      - .github/workflows/harden-cms-platform-4.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cms-platform-4
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 scripts/harden-cms-platform-4.py
      - name: Audit Firestore mutation paths
        run: |
          echo '--- raw Firestore mutators remaining in admin/lib ---'
          grep -RInE "(setDoc|updateDoc|deleteDoc|writeBatch|addDoc)" src/components/admin src/lib --include='*.ts' --include='*.tsx' || true
      - run: bun run lint
      - run: bun run build
        env:
          SITE_URL: https://videolab666.github.io/Dneprfilmcom
          VITE_SITE_URL: https://videolab666.github.io/Dneprfilmcom
          VITE_BASE_PATH: /Dneprfilmcom/
      - name: Commit hardened changes
        run: |
          rm -f scripts/harden-cms-platform-4.py .github/workflows/harden-cms-platform-4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hardened changes to commit."
            exit 0
          fi
          git commit -m "Harden CMS Platform 4.0"
          git push origin HEAD:feature/cms-platform-4
