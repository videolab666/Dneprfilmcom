name: One-time i18n dictionary fix

on:
  push:
    branches:
      - i18n/complete-public-locales

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[i18n-dict-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/complete-public-locales
          fetch-depth: 0
      - name: Remove duplicate dictionary key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/locales/legacyEnglish.ts')
          s = p.read_text()
          first = '  "Рішення": "Solutions",\n'
          if s.count('  "Рішення":') != 2:
              raise SystemExit('Expected exactly two Рішення keys before fix')
          s = s.replace(first, '', 1)
          p.write_text(s)
          PY
          rm -f .github/workflows/i18n-fix-dictionary.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix duplicate English dictionary key [i18n-dict-fixed]"
          git push origin HEAD:i18n/complete-public-locales
