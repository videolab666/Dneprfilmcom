name: One-time finish public English locale
on:
  push:
    branches: [i18n/complete-public-locales]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[finish-public-en]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/complete-public-locales
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - name: Patch final rendered English leaks and EN lead payload
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # LIVE: visible locale leaks + lead payload language.
          p = Path('src/pages/LiveProduction.tsx')
          s = p.read_text(encoding='utf-8')

          old = """      const formatNames = isUk ? {
                sports: 'Спортивна трансляція',
                conference: 'Бізнес-конференція / Форум',
                corporate: 'Корпоративний ефір',
                concert: 'Концерт / Шоу'
              } : {
                sports: 'Спортивная трансляция',
                conference: 'Бизнес-конференция / Форум',
                corporate: 'Корпоративный эфир',
                concert: 'Концерт / Шоу'
              };"""
          new = """      const formatNames = isEn ? {
                sports: 'Sports broadcast',
                conference: 'Business conference / Forum',
                corporate: 'Corporate broadcast',
                concert: 'Concert / Show'
              } : isUk ? {
                sports: 'Спортивна трансляція',
                conference: 'Бізнес-конференція / Форум',
                corporate: 'Корпоративний ефір',
                concert: 'Концерт / Шоу'
              } : {
                sports: 'Спортивная трансляция',
                conference: 'Бизнес-конференция / Форум',
                corporate: 'Корпоративный эфир',
                concert: 'Концерт / Шоу'
              };"""
          if old not in s:
              raise SystemExit('LIVE formatNames block not found')
          s = s.replace(old, new, 1)

          s = s.replace(
              'if (hasStarlink) selectedServices.push(l("Starlink + Multi-SIM бондинг", "Starlink + Multi-SIM бондинг"));',
              'if (hasStarlink) selectedServices.push(l("Starlink + Multi-SIM бондинг", "Starlink + Multi-SIM бондинг", "Starlink + Multi-SIM bonding"));',
              1,
          )
          s = s.replace(
              'if (needGraphics) selectedServices.push(l("Ефірна графіка та титри", "Эфирная графика и титры"));',
              'if (needGraphics) selectedServices.push(l("Ефірна графіка та титри", "Эфирная графика и титры", "Broadcast graphics and titles"));',
              1,
          )
          s = s.replace(
              'if (needReplay) selectedServices.push(l("Система повторів (Replay)", "Система повторов (Replay)"));',
              'if (needReplay) selectedServices.push(l("Система повторів (Replay)", "Система повторов (Replay)", "Replay system"));',
              1,
          )
          s = s.replace(
              'if (needTranslation) selectedServices.push(l("Синхронний переклад", "Синхронный перевод"));',
              'if (needTranslation) selectedServices.push(l("Синхронний переклад", "Синхронный перевод", "Simultaneous interpretation"));',
              1,
          )
          s = s.replace(
              'if (needLedOutput) selectedServices.push(l("Виведення на екрани зали (LED)", "Вывод на экраны зала (LED)"));',
              'if (needLedOutput) selectedServices.push(l("Виведення на екрани зали (LED)", "Вывод на экраны зала (LED)", "Venue LED screen output"));',
              1,
          )
          s = s.replace(
              'cameraCount: isUk ? `${cameraCount} камер(и)` : `${cameraCount} камер(ы)`,',
              "cameraCount: isEn ? `${cameraCount} ${cameraCount === 1 ? 'camera' : 'cameras'}` : isUk ? `${cameraCount} камер(и)` : `${cameraCount} камер(ы)`,",
              1,
          )
          s = s.replace(
              '{isUk ? `${cameraCount} ос.` : `${cameraCount} чел.`}',
              "{isEn ? `${cameraCount}` : isUk ? `${cameraCount} ос.` : `${cameraCount} чел.`}",
              1,
          )
          s = s.replace(
              '<span className="font-semibold text-slate-800">Сайт + YouTube</span>',
              '<span className="font-semibold text-slate-800">{l("Сайт + YouTube", "Сайт + YouTube", "Website + YouTube")}</span>',
              1,
          )
          s = s.replace(
              'alert(l("Сталася помилка під час надсилання заявки. Будь ласка, зв\'яжіться з нами безпосередньо за телефоном.", "Произошла ошибка при отправке заявки. Пожалуйста, свяжитесь с нами напрямую по телефону.")',
              'alert(l("Сталася помилка під час надсилання заявки. Будь ласка, зв\'яжіться з нами безпосередньо за телефоном.", "Произошла ошибка при отправке заявки. Пожалуйста, свяжитесь с нами напрямую по телефону.", "There was an error sending your request. Please contact us directly by phone.")',
              1,
          )
          p.write_text(s, encoding='utf-8')

          # Video calculator summary: EN used the RU arm of an isUk ternary.
          p = Path('src/pages/VideoProduction.tsx')
          s = p.read_text(encoding='utf-8')
          old = '{isUk ? <>Фіксований кошторис<br />після брифу</> : <>Фиксированная смета<br />после брифа</>}'
          new = '{l("Фіксований кошторис після брифу", "Фиксированная смета после брифа", "Fixed estimate after the brief")}'
          if old not in s:
              raise SystemExit('Video fixed-estimate label not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # Construction duration labels: add explicit EN rather than falling through.
          p = Path('src/pages/ConstructionMedia.tsx')
          s = p.read_text(encoding='utf-8')
          replacements = {
              'l("міс (1 рік)", "мес (1 год)")': 'l("міс (1 рік)", "мес (1 год)", "months (1 yr)")',
              'l("міс (2 роки)", "мес (2 года)")': 'l("міс (2 роки)", "мес (2 года)", "months (2 yrs)")',
              'l("міс (3 роки)", "мес (3 года)")': 'l("міс (3 роки)", "мес (3 года)", "months (3 yrs)")',
          }
          for old, new in replacements.items():
              if old not in s:
                  raise SystemExit(f'Construction duration label not found: {old}')
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          # This workflow is intentionally one-shot and must not remain in the PR.
          Path('.github/workflows/i18n-finish-visible.yml').unlink(missing_ok=True)
          PY
      - name: Verify, commit and push
        run: |
          bun install --frozen-lockfile
          bun run lint
          bun run build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows
          git commit -m "Finish public English locale leaks [finish-public-en]"
          git push origin HEAD:i18n/complete-public-locales
