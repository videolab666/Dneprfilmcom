name: Temporary i18n audit

on:
  push:
    branches:
      - i18n/complete-public-locales

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Find public locale debt
        run: |
          python3 - <<'PY'
          import pathlib, re

          roots = [pathlib.Path('src/pages'), pathlib.Path('src/components/home'), pathlib.Path('src/components/layout')]
          files = []
          for root in roots:
              files.extend(sorted(root.rglob('*.tsx')))
              files.extend(sorted(root.rglob('*.ts')))

          cyr = re.compile(r'[А-Яа-яЁёІіЇїЄєҐґ]')
          markers = ('isUk', 'isEn', "locale ===", "locale ==")
          for path in sorted(set(files)):
              lines = path.read_text(encoding='utf-8').splitlines()
              hits = []
              for i, line in enumerate(lines, 1):
                  if cyr.search(line) or any(m in line for m in markers):
                      hits.append((i, line.strip()))
              if hits:
                  print(f'\n### {path} ({len(hits)} hits)')
                  for i, line in hits:
                      print(f'{i}: {line}')
          PY
