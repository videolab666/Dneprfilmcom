name: One-time wire EN backstage seed fallbacks

on:
  push:
    branches:
      - i18n/complete-public-locales

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/complete-public-locales
          fetch-depth: 0
      - name: Patch context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('src/context/SiteContentContext.tsx')
          s=p.read_text(encoding='utf-8')
          anchor="} from '../locales/localizedContentEn';\n"
          if "backstageSeedEn" not in s:
              s=s.replace(anchor, anchor+"import { BACKSTAGE_SEED_EN } from '../locales/backstageSeedEn';\n",1)
          s=s.replace("const en = BACKSTAGE_TRANSLATIONS_EN[item.id];", "const en = BACKSTAGE_TRANSLATIONS_EN[item.id] || BACKSTAGE_SEED_EN[item.id];",1)
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/i18n-wire-backstage-seed-en.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/SiteContentContext.tsx .github/workflows
          git commit -m "Use English fallbacks for actual backstage CMS seeds [backstage-seed-en]"
          git push origin HEAD:i18n/complete-public-locales
