name: Temporary Migration Media Refinement

on:
  push:
    branches:
      - feature/firestore-migration-media2
    paths:
      - scripts/refine-migration-media.mjs
      - .github/workflows/temp-refine-migration-media.yml

permissions:
  contents: write

jobs:
  refine:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/firestore-migration-media2
      - run: node scripts/refine-migration-media.mjs
      - run: rm scripts/refine-migration-media.mjs .github/workflows/temp-refine-migration-media.yml
      - name: Commit refinements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refine legacy migration and gallery media handling"
          git push origin HEAD:feature/firestore-migration-media2
