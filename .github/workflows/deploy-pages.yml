name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # Refresh Firestore-driven sitemap/prerender even when content changes only through the CMS.
    - cron: '17 */6 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SITE_URL: https://videolab666.github.io/Dneprfilmcom
  VITE_SITE_URL: https://videolab666.github.io/Dneprfilmcom
  VITE_BASE_PATH: /Dneprfilmcom/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Admin media consistency audit
        run: |
          bunx tsx scripts/audit-admin-media-consistency.ts
          bunx tsx scripts/audit-admin-media-collections.ts

      - name: Build
        run: bun run build

      - name: Generate sitemap, image sitemap, robots and prerender route manifest
        run: bun scripts/generate-seo-assets.ts

      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Prerender public routes
        run: |
          set -euo pipefail

          bun run preview -- --host 127.0.0.1 --port 4174 > /tmp/dneprfilm-prerender-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4174/Dneprfilmcom/ >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:4174/Dneprfilmcom/ >/dev/null; then
            echo 'Vite prerender preview did not become ready.'
            cat /tmp/dneprfilm-prerender-preview.log
            exit 1
          fi

          CHROME=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done

          if [ -z "$CHROME" ]; then
            echo 'No Chromium-compatible browser found on the runner.'
            exit 1
          fi

          CHROME="$CHROME" PREVIEW_BASE_URL="http://127.0.0.1:4174/Dneprfilmcom" bun scripts/prerender-pages.ts

      - name: SEO artifact audit
        run: |
          set -euo pipefail
          test -s dist/sitemap.xml
          test -s dist/sitemap-images.xml
          test -s dist/robots.txt
          test -s dist/prerender-routes.json
          grep -q 'https://videolab666.github.io/Dneprfilmcom/videos' dist/sitemap.xml
          grep -q 'https://videolab666.github.io/Dneprfilmcom/galleries' dist/sitemap.xml
          grep -q 'https://videolab666.github.io/Dneprfilmcom/media-center' dist/sitemap.xml
          grep -q 'Sitemap: https://videolab666.github.io/Dneprfilmcom/sitemap.xml' dist/robots.txt
          grep -q 'Sitemap: https://videolab666.github.io/Dneprfilmcom/sitemap-images.xml' dist/robots.txt
          test -f dist/cases/index.html
          test -f dist/videos/index.html
          test -f dist/galleries/index.html
          test -f dist/media-center/index.html
          grep -q 'rel="canonical"' dist/cases/index.html
          grep -q 'rel="canonical"' dist/videos/index.html
          grep -q 'rel="canonical"' dist/galleries/index.html
          grep -q 'rel="canonical"' dist/media-center/index.html
          if grep -q 'name="robots" content="noindex' dist/cases/index.html; then echo '/cases is unexpectedly noindex'; exit 1; fi
          if grep -q 'name="robots" content="noindex' dist/videos/index.html; then echo '/videos is unexpectedly noindex'; exit 1; fi
          if grep -q 'name="robots" content="noindex' dist/galleries/index.html; then echo '/galleries is unexpectedly noindex'; exit 1; fi
          if grep -q 'name="robots" content="noindex' dist/media-center/index.html; then echo '/media-center is unexpectedly noindex'; exit 1; fi

          python3 - <<'PY'
          from pathlib import Path
          import html
          import re
          import sys

          SITE_PREFIX = '/Dneprfilmcom/'
          sections = ('cases', 'galleries', 'videos', 'media-center')
          failures = []
          checked = 0

          for section in sections:
              index_path = Path('dist') / section / 'index.html'
              source = index_path.read_text(encoding='utf-8')
              prefix = f'{SITE_PREFIX}{section}/'
              hrefs = {
                  html.unescape(match)
                  for match in re.findall(r'href="([^"]+)"', source)
                  if html.unescape(match).startswith(prefix)
              }

              for href in sorted(hrefs):
                  clean = href.split('?', 1)[0].split('#', 1)[0]
                  slug = clean[len(prefix):].strip('/')
                  if not slug:
                      continue
                  checked += 1
                  target = Path('dist') / section / slug / 'index.html'
                  if not target.is_file():
                      failures.append(f'{href} -> missing {target}')
                      continue

                  detail = target.read_text(encoding='utf-8')
                  if 'rel="canonical"' not in detail:
                      failures.append(f'{href} -> detail page has no canonical link')
                  if re.search(r'name="robots"[^>]+content="[^"]*noindex', detail, re.I):
                      failures.append(f'{href} -> prerendered detail page is unexpectedly noindex')

              print(f'Validated {len(hrefs)} link(s) from /{section}.')

          if failures:
              print('Public index/detail URL integrity audit failed:')
              for failure in failures:
                  print(f'  - {failure}')
              sys.exit(1)

          print(f'Validated {checked} public detail link(s) against prerender output and SEO metadata.')
          PY

          echo 'SEO artifacts and prerendered public indexes look correct.'

      - name: Structured SEO audit
        run: bun scripts/audit-seo-structured.ts

      - name: Browser smoke test
        run: |
          set -euo pipefail

          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/dneprfilm-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Dneprfilmcom/ >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:4173/Dneprfilmcom/ >/dev/null; then
            echo 'Vite preview did not become ready.'
            cat /tmp/dneprfilm-preview.log
            exit 1
          fi

          CHROME=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done

          if [ -z "$CHROME" ]; then
            echo 'No Chromium-compatible browser found on the runner.'
            exit 1
          fi

          routes=(
            ''
            'live'
            'video'
            'videos'
            'construction'
            'photo'
            'galleries'
            'cases'
            'cases/case-ulka'
            'cases/mizhnarodnyy-turnir-z-yedynoborstv-8-kamer-4k-translyatsiya-ta-live-replay-live-boxing'
            'media-center'
            'about'
            'contacts'
            'admin/login'
            'does-not-exist'
          )

          for route in "${routes[@]}"; do
            url="http://127.0.0.1:4173/Dneprfilmcom/${route}"
            echo "Smoke testing ${url}"

            html="$($CHROME \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=5000 \
              --dump-dom \
              "$url" 2>/tmp/dneprfilm-chrome.log || true)"

            if [ -z "$html" ]; then
              echo "Browser returned no DOM for ${url}"
              cat /tmp/dneprfilm-chrome.log || true
              exit 1
            fi

            if grep -q 'id="boot-fallback"' <<< "$html"; then
              echo "Static boot fallback was still present for ${url}"
              cat /tmp/dneprfilm-chrome.log || true
              exit 1
            fi

            if grep -q 'animate-spin' <<< "$html"; then
              echo "React route fallback was still present for ${url}"
              cat /tmp/dneprfilm-chrome.log || true
              exit 1
            fi

            if ! grep -q 'id="root"' <<< "$html"; then
              echo "React root is missing for ${url}"
              exit 1
            fi

            if [[ "$route" == cases/* ]] && grep -Eq 'Кейс не знайдено|Кейс не найден|Case not found' <<< "$html"; then
              echo "Case route unexpectedly rendered the not-found state: ${url}"
              exit 1
            fi
          done

          public_routes=(
            ''
            'live'
            'video'
            'videos'
            'construction'
            'photo'
            'galleries'
            'cases'
            'cases/case-ulka'
            'media-center'
            'about'
            'contacts'
            'does-not-exist'
          )

          for route in "${public_routes[@]}"; do
            url="http://127.0.0.1:4173/Dneprfilmcom/${route}?lang=en"
            echo "English locale audit ${url}"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=7000 \
              --dump-dom \
              "$url" > /tmp/dneprfilm-en.html 2>/tmp/dneprfilm-chrome.log || true

            ROUTE="$route" python3 - <<'PY'
          import html as html_module
          import os
          import re
          import sys

          source = open('/tmp/dneprfilm-en.html', encoding='utf-8').read()
          match = re.search(r'<body[^>]*>(.*?)</body>', source, re.I | re.S)
          body = match.group(1) if match else source
          body = re.sub(r'<script\b[^>]*>.*?</script>', ' ', body, flags=re.I | re.S)
          body = re.sub(r'<style\b[^>]*>.*?</style>', ' ', body, flags=re.I | re.S)
          text = html_module.unescape(re.sub(r'<[^>]+>', ' ', body))
          text = re.sub(r'\s+', ' ', text).strip()
          pattern = re.compile(r'[А-Яа-яЁёІіЇїЄєҐґ]')
          if pattern.search(text):
              route = os.environ.get('ROUTE') or '/'
              print(f'Cyrillic public text remained in EN locale on /{route}:')
              snippets = []
              for hit in pattern.finditer(text):
                  start = max(0, hit.start() - 70)
                  end = min(len(text), hit.end() + 100)
                  snippet = text[start:end].strip()
                  if snippet not in snippets:
                      snippets.append(snippet)
                  if len(snippets) >= 20:
                      break
              for snippet in snippets:
                  print('  -', snippet)
              sys.exit(1)
          PY
          done

          echo 'Browser and English locale smoke tests passed.'

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
