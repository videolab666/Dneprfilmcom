name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run lint

      - name: Build
        run: bun run build
        env:
          VITE_BASE_PATH: /Dneprfilmcom/

      - name: Add SPA fallback
        run: |
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Browser smoke test
        env:
          VITE_BASE_PATH: /Dneprfilmcom/
        run: |
          set -euo pipefail

          bun run preview -- --host 127.0.0.1 --port 4173 > /tmp/dneprfilm-preview.log 2>&1 &
          PREVIEW_PID=$!
          trap 'kill "$PREVIEW_PID" 2>/dev/null || true' EXIT

          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/Dneprfilmcom/ >/dev/null; then
              break
            fi
            sleep 1
          done

          if ! curl -fsS http://127.0.0.1:4173/Dneprfilmcom/ >/dev/null; then
            echo 'Vite preview did not become ready.'
            cat /tmp/dneprfilm-preview.log
            exit 1
          fi

          CHROME=''
          for candidate in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$candidate" >/dev/null 2>&1; then
              CHROME="$(command -v "$candidate")"
              break
            fi
          done

          if [ -z "$CHROME" ]; then
            echo 'No Chromium-compatible browser found on the runner.'
            exit 1
          fi

          routes=(
            ''
            'live'
            'video'
            'construction'
            'photo'
            'cases'
            'media-center'
            'about'
            'contacts'
            'admin/login'
            'does-not-exist'
          )

          for route in "${routes[@]}"; do
            url="http://127.0.0.1:4173/Dneprfilmcom/${route}"
            echo "Smoke testing ${url}"

            html="$($CHROME \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=5000 \
              --dump-dom \
              "$url" 2>/tmp/dneprfilm-chrome.log || true)"

            if [ -z "$html" ]; then
              echo "Browser returned no DOM for ${url}"
              cat /tmp/dneprfilm-chrome.log || true
              exit 1
            fi

            if grep -q 'id="boot-fallback"' <<< "$html"; then
              echo "Static boot fallback was still present for ${url}"
              cat /tmp/dneprfilm-chrome.log || true
              exit 1
            fi

            if grep -q 'animate-spin' <<< "$html"; then
              echo "React route fallback was still present for ${url}"
              cat /tmp/dneprfilm-chrome.log || true
              exit 1
            fi

            if ! grep -q 'id="root"' <<< "$html"; then
              echo "React root is missing for ${url}"
              exit 1
            fi
          done

          public_routes=(
            ''
            'live'
            'video'
            'construction'
            'photo'
            'cases'
            'media-center'
            'about'
            'contacts'
            'does-not-exist'
          )

          for route in "${public_routes[@]}"; do
            url="http://127.0.0.1:4173/Dneprfilmcom/${route}?lang=en"
            echo "English locale audit ${url}"
            "$CHROME" \
              --headless=new \
              --no-sandbox \
              --disable-gpu \
              --disable-dev-shm-usage \
              --virtual-time-budget=7000 \
              --dump-dom \
              "$url" > /tmp/dneprfilm-en.html 2>/tmp/dneprfilm-chrome.log || true

            ROUTE="$route" python3 - <<'PY'
          import html as html_module
          import os
          import re
          import sys

          source = open('/tmp/dneprfilm-en.html', encoding='utf-8').read()
          match = re.search(r'<body[^>]*>(.*?)</body>', source, re.I | re.S)
          body = match.group(1) if match else source
          body = re.sub(r'<script\b[^>]*>.*?</script>', ' ', body, flags=re.I | re.S)
          body = re.sub(r'<style\b[^>]*>.*?</style>', ' ', body, flags=re.I | re.S)
          text = html_module.unescape(re.sub(r'<[^>]+>', ' ', body))
          text = re.sub(r'\s+', ' ', text).strip()
          pattern = re.compile(r'[А-Яа-яЁёІіЇїЄєҐґ]')
          if pattern.search(text):
              route = os.environ.get('ROUTE') or '/'
              print(f'Cyrillic public text remained in EN locale on /{route}:')
              snippets = []
              for hit in pattern.finditer(text):
                  start = max(0, hit.start() - 70)
                  end = min(len(text), hit.end() + 100)
                  snippet = text[start:end].strip()
                  if snippet not in snippets:
                      snippets.append(snippet)
                  if len(snippets) >= 20:
                      break
              for snippet in snippets:
                  print('  -', snippet)
              sys.exit(1)
          PY
          done

          echo 'Browser and English locale smoke tests passed.'

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
