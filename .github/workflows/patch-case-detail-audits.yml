name: One-time patch case detail media

on:
  push:
    branches:
      - feature/full-case-media-portfolio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/full-case-media-portfolio
      - name: Keep single video media visible
        run: |
          python3 - <<'PY'
          from pathlib import Path

          detail = Path('src/pages/CaseDetail.tsx')
          text = detail.read_text()
          old = "    if (items.length <= 1) return [];\n    return items.filter(item => !(item.type === 'image' && rawCase.imageUrl && item.url === rawCase.imageUrl));"
          new = "    return items.filter(item => !(item.type === 'image' && rawCase.imageUrl && item.url === rawCase.imageUrl));"
          if old not in text:
              raise SystemExit('Expected CaseDetail media block not found')
          detail.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/pages/CaseDetail.tsx
          git commit -m "Keep single case video visible"
          git push origin HEAD:feature/full-case-media-portfolio
