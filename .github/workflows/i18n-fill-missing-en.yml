name: One-time fill missing EN translations

on:
  push:
    branches:
      - i18n/complete-public-locales

permissions:
  contents: write

jobs:
  fill:
    if: ${{ !contains(github.event.head_commit.message, '[fill-en-complete]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/complete-public-locales
          fetch-depth: 0

      - name: Fill missing English translations
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path

          translations = json.loads(r'''{"home.directionsTitle":"Our Services","home.directionsSubtitle":"We specialize in solving complex visual marketing challenges for the B2B sector.","home.liveTitle":"LIVE Production","home.liveBullet1":"Sports broadcasts","home.liveBullet2":"Conferences and forums","home.liveBullet3":"vMix OB production and Starlink","home.videoTitle":"Video Production","home.videoBullet1":"Brand advertising","home.videoBullet2":"Industrial and medical production","home.videoBullet3":"Podcasts and interviews","home.constructionTitle":"Construction Media","home.constructionBullet1":"4K Long-Term Timelapse","home.constructionBullet2":"Drone monitoring","home.constructionBullet3":"3D views from residential developments","home.photoTitle":"Photography","home.photoBullet1":"Interiors and architecture","home.photoBullet2":"Food photography for menus","home.photoBullet3":"Children, celebrations and weddings","home.moreDetails":"Learn More","home.more":"Learn More","home.aboutFounderBtn":"About Alexander Pitel","home.discussPersonally":"Discuss your project directly","live.liveSports":"Sports broadcasts","live.conferences":"Conferences and forums","live.vmixStarlink":"vMix OB production and Starlink","video.imageAds":"Brand advertising","video.factories":"Industrial and medical production","video.podcasts":"Podcasts and interviews","construction.timelapse":"4K Long-Term Timelapse","construction.drone":"Drone monitoring","construction.views3d":"3D views from residential developments","photo.interiors":"Interiors and architecture","photo.food":"Food photography for menus","photo.events":"Children, celebrations and weddings","founder.aboutBtn":"About Alexander Pitel","founder.discussBtn":"Discuss your project directly","featuredCases.badge":"Project Portfolio","featuredCases.title":"Featured Studio Case Studies","featuredCases.subtitlePrefix":"Our approach: ","featuredCases.subtitleBold":"“Challenge → Technical Solution → Measurable Result”","featuredCases.subtitleSuffix":". No cookie-cutter productions.","featuredCases.all":"All Projects","featuredCases.live":"LIVE Production","featuredCases.video":"Video","featuredCases.construction":"Construction & 3D","featuredCases.client":"Client:","featuredCases.problemLabel":"Challenge:","featuredCases.resultLabel":"Result:","featuredCases.moreBtn":"View Solution Details","featuredCases.archivePrefix":"Our studio archive contains another ","featuredCases.archiveSuffix":" current projects and live productions.","featuredCases.openCatalog":"Open Full Catalog","featuredCases.viewAll":"View All Studio Case Studies","featuredCases.modalProblem":"Client's Initial Challenge:","featuredCases.modalSolution":"Engineering Solution & Setup:","featuredCases.modalResult":"Final Result:","featuredCases.modalClose":"Close","featuredCases.modalDiscuss":"Discuss a Similar Project","cases.portfolioBadge":"Project Portfolio","cases.featuredTitle":"Featured Studio Case Studies","cases.allProjects":"All Projects","cases.constructionAnd3d":"Construction & 3D","cases.clientLabel":"Client","cases.taskLabel":"Challenge","cases.resultLabel":"Result","cases.detailsBtn":"View Solution Details","cases.allCasesBtn":"View All Studio Case Studies","cases.problemModal":"Client's Initial Challenge","cases.solutionModal":"Engineering Solution & Setup","cases.resultModal":"Final Result","cases.closeModal":"Close","cases.discussSimilar":"Discuss a Similar Project","synergy.badge":"Production Synergy","synergy.title":"One General Contractor. Every Visual Solution.","synergy.subtitle":"You no longer need to hire camera operators, streaming crews, sound engineers, editors and drone pilots separately. One coordinated production team handles the entire scope.","synergy.mainPlus":"Key Advantage","synergy.mainPlusTitle":"One Contract, One Visual Standard","synergy.mainPlusDesc":"One person accountable — founder Alexander Pitel.","synergy.compareTitle":"Comparison: 4 Separate Contractors vs. LIVE & VIDEO","synergy.oldWayTitle":"Traditional approach (multiple freelancers):","synergy.newWayTitle":"LIVE & VIDEO approach (one production team):","how.badge":"Transparency & Control","how.title":"Studio Production Workflow","how.subtitle":"A step-by-step production cycle from the first call to final archive delivery. You always know what is happening at every stage.","how.stepIncludes":"What this stage includes:","how.stepTerm":"Estimated timeline:","how.stepArtifacts":"Stage deliverables:","how.requestReglament":"Request a Workflow for Your Project","how.guarantee1Title":"Redundant Signal Paths","how.guarantee1Desc":"Every critical component — internet, power, switchers and recording — has a hot backup. The broadcast remains protected against a single-point failure.","how.guarantee2Title":"Fixed Estimate","how.guarantee2Desc":"The price is agreed before production starts and fixed in the contract. No surprise charges for fuel, parking or an extra hour of editing.","how.guarantee3Title":"Founder-Level Oversight","how.guarantee3Desc":"Alexander Pitel personally oversees the technical rider and key production processes for every studio project.","testimonials.subtitle":"Feedback from clients who trust us with the reputation of their events, broadcasts and construction projects.","quickContact.badge":"Fast Project Start","quickContact.title":"Get an Estimate and Production Concept in 15 Minutes","quickContact.subtitlePrefix":"Tell us about your project. Studio founder ","quickContact.founderName":"Alexander Pitel","quickContact.subtitleSuffix":" or a senior engineer will contact you to recommend the right crew and equipment without unnecessary costs.","quickContact.replyTime":"Response within 15 minutes during business hours","quickContact.fixedBudget":"Fixed estimate and NDA confidentiality","quickContact.phoneDirect":"Direct phone line","quickContact.nameLabel":"Your Name","quickContact.namePlaceholder":"For example: Artem / Event Agency","quickContact.phoneLabel":"Phone (Telegram / WhatsApp) *","quickContact.directionLabel":"Service of Interest","quickContact.directionLive":"LIVE Streaming","quickContact.directionVideo":"Video","quickContact.directionConstruction":"Construction / 3D","quickContact.commentLabel":"Brief project description or date (optional)","quickContact.commentPlaceholder":"For example: Judo tournament on October 14, 4 cameras and instant replays required...","quickContact.submitBtn":"Get an Estimate & Consultation","quickContact.submitting":"Sending...","quickContact.successTitle":"Your Request Has Been Received!","quickContact.successDesc":"We are already reviewing your project parameters and will call you within 15 minutes.","quickContact.sendAnother":"Send Another Request","quickContact.disclaimer":"By clicking the button, you agree that your contact details may be processed for the purpose of responding to your inquiry.","clients.close":"Close","casesPage.badge":"Portfolio & Case Studies","casesPage.title":"Completed Studio Projects","casesPage.subtitle":"Television broadcasts, brand films, industrial promos and long-term construction monitoring.","casesPage.searchPlaceholder":"Search by title, client or equipment...","casesPage.all":"All Projects","casesPage.live":"Live Broadcasts","casesPage.video":"Advertising & Production","casesPage.construction":"Construction Monitoring","casesPage.problem":"Challenge:","casesPage.solution":"Solution:","casesPage.result":"Result:","casesPage.discussCase":"Discuss a Similar Project","casesPage.noResults":"No projects match your search","casesPage.resetFilter":"Reset Filters","casesPage.orderSimilar":"Order a Similar Project","casesPage.inquiryTitle":"Case Study Inquiry:","casesPage.inquirySuccess":"Your request has been sent successfully! We will contact you shortly.","livePage.calcTitle":"Interactive OB Van Configurator","livePage.calcSubtitle":"Configure your event parameters and get a preliminary cost estimate in one minute.","livePage.sendBrief":"Send Brief for Estimate","livePage.estimateTotal":"Estimated Budget:"}''')
          p = Path('src/locales/enTranslations.ts')
          s = p.read_text(encoding='utf-8')
          existing = set(re.findall(r"['\"]([^'\"]+)['\"]\s*:", s))
          missing = [k for k in translations if k not in existing]
          if missing:
              insert = "\n  // Complete public UI translations\n" + "".join(
                  f"  {json.dumps(k)}: {json.dumps(translations[k], ensure_ascii=False)},\n"
                  for k in missing
              )
              pos = s.rfind("\n};")
              if pos == -1:
                  raise SystemExit('Could not find EN_TRANSLATIONS closing brace')
              s = s[:pos] + insert + s[pos:]
              p.write_text(s, encoding='utf-8')

          Path('.github/workflows/i18n-key-audit.yml').unlink(missing_ok=True)
          Path('.github/workflows/i18n-fill-missing-en.yml').unlink(missing_ok=True)

          en_src = p.read_text(encoding='utf-8')
          en_keys = set(re.findall(r"['\"]([^'\"]+)['\"]\s*:", en_src))
          still_missing = [k for k in translations if k not in en_keys]
          if still_missing:
              raise SystemExit(f'Still missing EN keys: {still_missing}')
          print(f'Added {len(missing)} English translation keys')
          PY

      - name: Commit translations
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/locales/enTranslations.ts .github/workflows
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete English translation dictionary [fill-en-complete]"
          git push origin HEAD:i18n/complete-public-locales
