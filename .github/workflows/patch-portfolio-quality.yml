name: One-time patch portfolio quality

on:
  push:
    branches:
      - feature/full-case-media-portfolio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/full-case-media-portfolio
      - name: Patch localized metrics and upload cleanup
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # CaseStudy: make custom metric labels localizable.
          path = Path('src/types.ts')
          text = path.read_text()
          old = "  metrics?: { label: string; value: string }[];\n  year?: string;"
          new = "  metrics?: { label: string; value: string }[];\n  metrics_uk?: { label: string; value: string }[];\n  metrics_en?: { label: string; value: string }[];\n  year?: string;"
          if old not in text:
              raise SystemExit('CaseStudy metrics marker not found')
          path.write_text(text.replace(old, new, 1))

          # Localized public case helpers.
          path = Path('src/context/SiteContentContext.tsx')
          text = path.read_text()
          old = "      metrics: en?.metrics || translateEnglishValue(uk?.metrics || c.metrics),"
          new = "      metrics: c.metrics_en || en?.metrics || translateEnglishValue(c.metrics_uk || uk?.metrics || c.metrics),"
          if old not in text:
              raise SystemExit('English metrics marker not found')
          text = text.replace(old, new, 1)
          old = "        metrics: uk?.metrics || c.metrics,"
          new = "        metrics: c.metrics_uk || uk?.metrics || c.metrics,"
          if old not in text:
              raise SystemExit('Ukrainian metrics marker not found')
          path.write_text(text.replace(old, new, 1))

          path = Path('src/components/admin/CasesManager.tsx')
          text = path.read_text()
          text = text.replace(
              "  metrics: [],\n  imageUrl: '',",
              "  metrics: [],\n  metrics_uk: [],\n  metrics_en: [],\n  imageUrl: '',",
              1,
          )
          text = text.replace(
              "  const [pendingDeletePaths, setPendingDeletePaths] = useState<string[]>([]);\n  const fileInputRef",
              "  const [pendingDeletePaths, setPendingDeletePaths] = useState<string[]>([]);\n  const [newUploadPaths, setNewUploadPaths] = useState<string[]>([]);\n  const fileInputRef",
              1,
          )
          text = text.replace(
              "    setPendingDeletePaths([]);\n    setNewMediaUrl('');\n  };",
              "    setPendingDeletePaths([]);\n    setNewUploadPaths([]);\n    setNewMediaUrl('');\n  };",
              1,
          )
          # Same reset in createNew.
          marker = "    setPendingDeletePaths([]);\n    setNewMediaUrl('');\n  };"
          if marker not in text:
              raise SystemExit('createNew reset marker not found')
          text = text.replace(marker, "    setPendingDeletePaths([]);\n    setNewUploadPaths([]);\n    setNewMediaUrl('');\n  };", 1)

          insert_after = "  const setLocalizedField = (base: 'title' | 'categoryLabel' | 'description' | 'challenge' | 'solution' | 'result' | 'location', value: string) => {\n    if (!editing) return;\n    if (language === 'ru') {\n      setEditing({ ...editing, [base]: value });\n      return;\n    }\n    setEditing({ ...editing, [`${base}_${language}`]: value });\n  };\n"
          metrics_helpers = insert_after + "\n  const getLocalizedMetrics = (): { label: string; value: string }[] => {\n    if (!editing) return [];\n    if (language === 'uk') return editing.metrics_uk || editing.metrics || [];\n    if (language === 'en') return editing.metrics_en || editing.metrics_uk || editing.metrics || [];\n    return editing.metrics || [];\n  };\n\n  const setLocalizedMetrics = (value: string) => {\n    if (!editing) return;\n    const next = textToMetrics(value);\n    if (language === 'uk') {\n      setEditing({ ...editing, metrics_uk: next });\n    } else if (language === 'en') {\n      setEditing({ ...editing, metrics_en: next });\n    } else {\n      setEditing({ ...editing, metrics: next });\n    }\n  };\n\n  const cancelEditing = async () => {\n    const orphaned = [...new Set(newUploadPaths)];\n    if (orphaned.length) await Promise.all(orphaned.map(path => deleteCaseImage(path)));\n    setNewUploadPaths([]);\n    setPendingDeletePaths([]);\n    setEditing(null);\n  };\n"
          if insert_after not in text:
              raise SystemExit('setLocalizedField block not found')
          text = text.replace(insert_after, metrics_helpers, 1)

          text = text.replace(
              "        const uploaded = await uploadCaseImage(file, editing.id);\n        added.push({",
              "        const uploaded = await uploadCaseImage(file, editing.id);\n        setNewUploadPaths(paths => [...paths, uploaded.storagePath]);\n        added.push({",
              1,
          )

          old = "      await setDoc(doc(db, 'cases', editing.id), payload);\n      await Promise.all(pendingDeletePaths.map(path => deleteCaseImage(path)));\n      setPendingDeletePaths([]);\n      setEditing(null);"
          new = "      await setDoc(doc(db, 'cases', editing.id), payload);\n      const referencedPaths = new Set(cleanedMedia.map(item => item.storagePath).filter(Boolean));\n      const orphanedUploads = newUploadPaths.filter(path => !referencedPaths.has(path));\n      const pathsToDelete = [...new Set([...pendingDeletePaths, ...orphanedUploads])];\n      await Promise.all(pathsToDelete.map(path => deleteCaseImage(path)));\n      setPendingDeletePaths([]);\n      setNewUploadPaths([]);\n      setEditing(null);"
          if old not in text:
              raise SystemExit('save cleanup block not found')
          text = text.replace(old, new, 1)

          old = "                  <label className=\"text-xs font-bold text-slate-700 sm:col-span-2\">Метрики: одна строка = Название | Значение\n                    <textarea rows={4} value={metricsToText(editing.metrics)} onChange={e => setEditing({ ...editing, metrics: textToMetrics(e.target.value) })} className=\"mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 font-normal text-sm\" />\n                  </label>"
          new = "                  <label className=\"text-xs font-bold text-slate-700 sm:col-span-2\">Метрики ({language.toUpperCase()}): одна строка = Название | Значение\n                    <textarea rows={4} value={metricsToText(getLocalizedMetrics())} onChange={e => setLocalizedMetrics(e.target.value)} className=\"mt-1 w-full rounded-xl border border-slate-300 px-3 py-2 font-normal text-sm\" />\n                  </label>"
          if old not in text:
              raise SystemExit('metrics textarea not found')
          text = text.replace(old, new, 1)

          # Both close controls must clean newly uploaded, unsaved objects.
          text = text.replace("onClick={() => setEditing(null)}", "onClick={() => void cancelEditing()}")
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/types.ts src/context/SiteContentContext.tsx src/components/admin/CasesManager.tsx
          git commit -m "Harden portfolio media editing"
          git push origin HEAD:feature/full-case-media-portfolio
