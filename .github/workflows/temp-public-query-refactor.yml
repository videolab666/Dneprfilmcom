name: Temporary Public Query Refactor

on:
  push:
    branches:
      - feature/firestore-migration-media2
    paths:
      - scripts/refactor-public-queries.mjs
      - .github/workflows/temp-public-query-refactor.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refactor:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v7
        with:
          ref: feature/firestore-migration-media2

      - name: Apply published-only query refactor
        run: node scripts/refactor-public-queries.mjs

      - name: Remove one-shot helper
        run: rm scripts/refactor-public-queries.mjs .github/workflows/temp-public-query-refactor.yml

      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use published-only Firestore queries in public app"
          git push origin HEAD:feature/firestore-migration-media2
