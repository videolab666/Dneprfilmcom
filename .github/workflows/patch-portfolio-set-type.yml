name: One-time patch portfolio Set typing

on:
  push:
    branches:
      - feature/full-case-media-portfolio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/full-case-media-portfolio
      - name: Fix TypeScript Set inference
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/admin/CasesManager.tsx')
          text = path.read_text()
          old = "      const referencedPaths = new Set(cleanedMedia.map(item => item.storagePath).filter(Boolean));"
          new = "      const referencedPaths = new Set<string>(\n        cleanedMedia\n          .map(item => item.storagePath)\n          .filter((path): path is string => Boolean(path))\n      );"
          if old not in text:
              raise SystemExit('Expected referencedPaths line not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/admin/CasesManager.tsx
          git commit -m "Fix portfolio Storage path typing"
          git push origin HEAD:feature/full-case-media-portfolio
