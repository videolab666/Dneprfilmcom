name: One-time Hero media slider integration

on:
  push:
    branches:
      - feature/hero-media-slider

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/hero-media-slider

      - name: Patch existing application files
        run: python3 scripts/patch-hero-slider.py

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "Integrate Hero photo and video slider CMS"
          git push origin HEAD:feature/hero-media-slider
