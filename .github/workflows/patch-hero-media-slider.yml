name: One-time Hero media slider integration

on:
  push:
    branches:
      - feature/hero-media-slider

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: feature/hero-media-slider

      - name: Patch existing application files
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Types: add Hero slider schema without disturbing existing CMS types.
          types = Path('src/types.ts')
          text = types.read_text()
          marker = "export type Locale = 'uk' | 'ru' | 'en';\n\n"
          insert = """export type Locale = 'uk' | 'ru' | 'en';

export type HeroSlideType = 'image' | 'video';

export interface HeroSlide {
  id: string;
  type: HeroSlideType;
  url: string;
  mobileUrl?: string;
  posterUrl?: string;
  cloudinaryPublicId?: string;
  durationMs?: number;
  overlayOpacity?: number;
  objectPosition?: string;
  enabled?: boolean;
  badge?: string;
  badge_uk?: string;
  badge_en?: string;
  title?: string;
  title_uk?: string;
  title_en?: string;
  subtitle?: string;
  subtitle_uk?: string;
  subtitle_en?: string;
  ctaPrimaryText?: string;
  ctaPrimaryText_uk?: string;
  ctaPrimaryText_en?: string;
  ctaPrimaryLink?: string;
  ctaSecondaryText?: string;
  ctaSecondaryText_uk?: string;
  ctaSecondaryText_en?: string;
  ctaSecondaryLink?: string;
}

"""
          if marker not in text:
              raise SystemExit('Locale marker not found in types.ts')
          text = text.replace(marker, insert, 1)
          prop_marker = "  heroBgImage: string;\n"
          if prop_marker not in text:
              raise SystemExit('heroBgImage marker not found in types.ts')
          text = text.replace(prop_marker, prop_marker + "  heroSlides?: HeroSlide[];\n", 1)
          types.write_text(text)

          # Cloudinary upload layer: images + Hero background videos.
          Path('src/lib/mediaUpload.ts').write_text(r'''const CLOUDINARY_CLOUD_NAME = 'n6l9imb7';
          const CLOUDINARY_UPLOAD_PRESET = '123123';
          const MAX_IMAGE_SOURCE_BYTES = 25 * 1024 * 1024;
          const MAX_VIDEO_SOURCE_BYTES = 100 * 1024 * 1024;
          const MAX_EDGE = 2400;
          const WEBP_QUALITY = 0.88;

          interface CloudinaryUploadResponse {
            secure_url?: string;
            public_id?: string;
            error?: { message?: string };
          }

          interface UploadedAsset {
            url: string;
            publicId: string;
          }

          function sanitizeName(name: string): string {
            return name
              .replace(/\.[^.]+$/, '')
              .toLowerCase()
              .replace(/[^a-z0-9_-]+/g, '-')
              .replace(/^-+|-+$/g, '')
              .slice(0, 70) || 'media';
          }

          async function loadBitmap(file: File): Promise<ImageBitmap> {
            if ('createImageBitmap' in window) return createImageBitmap(file);
            throw new Error('Этот браузер не поддерживает подготовку изображений для загрузки.');
          }

          async function optimizeImage(file: File): Promise<Blob> {
            if (!file.type.startsWith('image/')) throw new Error('Можно загружать только изображения.');
            if (file.size > MAX_IMAGE_SOURCE_BYTES) throw new Error('Исходное изображение больше 25 МБ.');

            const bitmap = await loadBitmap(file);
            const scale = Math.min(1, MAX_EDGE / Math.max(bitmap.width, bitmap.height));
            const width = Math.max(1, Math.round(bitmap.width * scale));
            const height = Math.max(1, Math.round(bitmap.height * scale));
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const context = canvas.getContext('2d');
            if (!context) {
              bitmap.close();
              throw new Error('Не удалось подготовить изображение.');
            }
            context.drawImage(bitmap, 0, 0, width, height);
            bitmap.close();

            const blob = await new Promise<Blob | null>(resolve => canvas.toBlob(resolve, 'image/webp', WEBP_QUALITY));
            if (!blob) throw new Error('Не удалось сжать изображение.');
            return blob;
          }

          async function uploadUnsigned(
            file: Blob,
            resourceType: 'image' | 'video',
            folder: string,
            filename: string,
          ): Promise<UploadedAsset> {
            const formData = new FormData();
            formData.append('file', file, filename);
            formData.append('upload_preset', CLOUDINARY_UPLOAD_PRESET);
            formData.append('folder', folder);

            const response = await fetch(
              `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/${resourceType}/upload`,
              { method: 'POST', body: formData },
            );
            const data = await response.json() as CloudinaryUploadResponse;

            if (!response.ok || !data.secure_url || !data.public_id) {
              throw new Error(data.error?.message || `Cloudinary upload failed (${response.status}).`);
            }

            return { url: data.secure_url, publicId: data.public_id };
          }

          function videoPosterUrl(url: string): string | undefined {
            const marker = '/video/upload/';
            const index = url.indexOf(marker);
            if (index < 0) return undefined;
            const prefix = url.slice(0, index + marker.length);
            const rest = url.slice(index + marker.length);
            const queryIndex = rest.indexOf('?');
            const pathPart = queryIndex >= 0 ? rest.slice(0, queryIndex) : rest;
            const withoutExtension = pathPart.replace(/\.[a-z0-9]+$/i, '');
            return `${prefix}so_0,f_jpg,q_auto/${withoutExtension}.jpg`;
          }

          export async function uploadCaseImage(file: File, caseId: string): Promise<UploadedAsset> {
            const optimized = await optimizeImage(file);
            return uploadUnsigned(
              optimized,
              'image',
              `dneprfilm/cases/${sanitizeName(caseId)}`,
              `${sanitizeName(file.name)}.webp`,
            );
          }

          export async function uploadHeroImage(file: File): Promise<UploadedAsset> {
            const optimized = await optimizeImage(file);
            return uploadUnsigned(
              optimized,
              'image',
              'dneprfilm/hero',
              `${sanitizeName(file.name)}.webp`,
            );
          }

          export async function uploadHeroVideo(file: File): Promise<UploadedAsset & { posterUrl?: string }> {
            if (!['video/mp4', 'video/webm'].includes(file.type)) {
              throw new Error('Для Hero используйте MP4 или WebM.');
            }
            if (file.size > MAX_VIDEO_SOURCE_BYTES) {
              throw new Error('Видео Hero больше 100 МБ. Сожмите клип или добавьте его URL.');
            }
            const extension = file.type === 'video/webm' ? 'webm' : 'mp4';
            const uploaded = await uploadUnsigned(
              file,
              'video',
              'dneprfilm/hero',
              `${sanitizeName(file.name)}.${extension}`,
            );
            return { ...uploaded, posterUrl: videoPosterUrl(uploaded.url) };
          }
          '''.replace('          ', ''))

          # Home: replace the legacy single-image Hero with the reusable slider.
          home = Path('src/pages/Home.tsx')
          text = home.read_text()
          text = text.replace("import { Camera, Radio, Building2, Video, Play, ArrowRight, Sparkles } from 'lucide-react';", "import { Camera, Radio, Building2, Video, Play, ArrowRight } from 'lucide-react';")
          text = text.replace("import { motion } from 'motion/react';\n", '')
          anchor = "import { ClientsMarquee } from '../components/ClientsMarquee';\n"
          if anchor not in text:
              raise SystemExit('Home import anchor not found')
          text = text.replace(anchor, anchor + "import { HeroSlider } from '../components/home/HeroSlider';\n", 1)
          start = text.index('      {/* Hero Section */}')
          end = text.index('      {/* Clients & Partners Infinite Marquee Strip */}')
          replacement = "      {/* Hero Section */}\n      <HeroSlider />\n\n"
          text = text[:start] + replacement + text[end:]
          home.write_text(text)

          # Admin: mount the new Hero media manager inside the existing Hero settings tab.
          editor = Path('src/components/admin/SiteSettingsEditor.tsx')
          text = editor.read_text()
          anchor = "import { SiteSetting } from '../../types';\n"
          if anchor not in text:
              raise SystemExit('SiteSettingsEditor import anchor not found')
          text = text.replace(anchor, anchor + "import { HeroSlidesEditor } from './HeroSlidesEditor';\n", 1)
          heading = """            </h3>\n\n            {/* Mini visual live preview */}"""
          if heading not in text:
              raise SystemExit('Hero heading insertion point not found')
          text = text.replace(
              heading,
              """            </h3>\n\n            <HeroSlidesEditor formData={formData} setFormData={setFormData} langTab={langTab} />\n\n            {/* Mini visual live preview */}""",
              1,
          )
          text = text.replace(
              'Фоновое изображение первого экрана (URL)',
              'Fallback-фото Hero (используется, если слайдов нет)',
              1,
          )
          editor.write_text(text)
          PY

      - name: Commit integration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src
          git commit -m "Integrate Hero photo and video slider CMS"
          git push origin HEAD:feature/hero-media-slider
