name: One-time adjust Firebase test tooling

on:
  push:
    branches:
      - chore/pin-firebase-test-tooling

permissions:
  contents: write

jobs:
  adjust:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/pin-firebase-test-tooling

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install existing dependencies
        run: bun install --frozen-lockfile

      - name: Remove Firebase CLI from app dependencies
        run: bun remove firebase-tools

      - name: Commit package metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock
          git commit -m "Keep Firebase CLI scoped to rules CI"
          git push origin HEAD:chore/pin-firebase-test-tooling
