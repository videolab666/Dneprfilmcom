name: Apply CMS Platform 4.0

on:
  push:
    branches:
      - feature/cms-platform-4
    paths:
      - scripts/apply-cms-platform-4.py
      - scripts/fix-cms-platform-4.py
      - .github/workflows/apply-cms-platform-4.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cms-platform-4
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 scripts/apply-cms-platform-4.py
      - run: python3 scripts/fix-cms-platform-4.py
      - run: bun run lint
      - run: bun run build
        env:
          SITE_URL: https://videolab666.github.io/Dneprfilmcom
          VITE_SITE_URL: https://videolab666.github.io/Dneprfilmcom
          VITE_BASE_PATH: /Dneprfilmcom/
      - name: Commit generated changes
        run: |
          rm -f scripts/apply-cms-platform-4.py scripts/fix-cms-platform-4.py .github/workflows/apply-cms-platform-4.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
            exit 0
          fi
          git commit -m "Implement CMS Platform 4.0"
          git push origin HEAD:feature/cms-platform-4
