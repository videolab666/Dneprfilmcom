name: One-time patch portfolio cancel cleanup typing

on:
  push:
    branches:
      - feature/full-case-media-portfolio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/full-case-media-portfolio
      - name: Fix cancel cleanup typing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/components/admin/CasesManager.tsx')
          text = path.read_text()
          old = "    const orphaned = [...new Set(newUploadPaths)];\n    if (orphaned.length) await Promise.all(orphaned.map(path => deleteCaseImage(path)));"
          new = "    const orphaned = Array.from(new Set<string>(newUploadPaths));\n    if (orphaned.length) await Promise.all(orphaned.map((path: string) => deleteCaseImage(path)));"
          if old not in text:
              raise SystemExit('Expected cancel cleanup block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/admin/CasesManager.tsx
          git commit -m "Fix portfolio cancel cleanup typing"
          git push origin HEAD:feature/full-case-media-portfolio
