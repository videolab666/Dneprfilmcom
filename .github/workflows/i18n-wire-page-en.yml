name: One-time wire curated page English
on:
  push:
    branches: [i18n/complete-public-locales]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wire-page-en]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/complete-public-locales
          fetch-depth: 0
      - name: Wire curated English page fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/data/pageContent.ts')
          s = p.read_text(encoding='utf-8')
          anchor = "import { translateEnglishValue } from '../locales/legacyEnglish';\n"
          if "PAGE_ITEM_EN_BY_ID" not in s:
              s = s.replace(anchor, anchor + "import { PAGE_ITEM_EN_BY_ID } from '../locales/pageEnglish';\n", 1)
          old = "  if (locale === 'en') return item.en || translateEnglishValue(item.uk || item.ru);"
          new = "  if (locale === 'en') return { ...translateEnglishValue(item.uk || item.ru), ...(PAGE_ITEM_EN_BY_ID[item.id] || {}), ...(item.en || {}) };"
          if old not in s:
              raise SystemExit('Expected EN fallback line not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/i18n-wire-page-en.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/pageContent.ts .github/workflows
          git commit -m "Use curated English page fallbacks [wire-page-en]"
          git push origin HEAD:i18n/complete-public-locales
