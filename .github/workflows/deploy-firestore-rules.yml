name: Deploy Firestore Rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - firebase.json
      - .firebaserc
      - scripts/test-firestore-rules.mjs
      - .github/workflows/deploy-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: firestore-rules-production
  cancel-in-progress: false

env:
  FIREBASE_PROJECT_ID: gen-lang-client-0973206519
  FIRESTORE_DATABASE_ID: ai-studio-2b172e30-4fd3-4131-ba5b-61712d198b9e

jobs:
  deploy:
    # Disabled by default. Enable only after WIF + repository secrets are configured.
    if: ${{ vars.FIREBASE_RULES_DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Regression-test Firestore rules
        run: >-
          bunx firebase-tools emulators:exec
          --only firestore
          --project "$FIREBASE_PROJECT_ID"
          "bun scripts/test-firestore-rules.mjs"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_FIREBASE_RULES_SERVICE_ACCOUNT }}

      - name: Deploy rules to the named Firestore database
        run: >-
          bunx firebase-tools deploy
          --only "firestore:${FIRESTORE_DATABASE_ID}"
          --project "$FIREBASE_PROJECT_ID"
          --non-interactive
