name: Finish CMS Versioning Coverage

on:
  push:
    branches:
      - feature/cms-platform-4
    paths:
      - scripts/finish-versioning-coverage.py
      - .github/workflows/finish-versioning-coverage.yml

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/cms-platform-4
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: python3 scripts/finish-versioning-coverage.py
      - name: Audit active CMS mutation paths
        run: |
          echo '--- active raw mutators after patch ---'
          grep -RInE "(writeBatch\(|import .*updateDoc.*firebase/firestore|import .*setDoc.*firebase/firestore|import .*deleteDoc.*firebase/firestore)" src/components/admin src/lib --include='*.ts' --include='*.tsx' || true
      - run: bun run lint
      - run: bun run build
        env:
          SITE_URL: https://videolab666.github.io/Dneprfilmcom
          VITE_SITE_URL: https://videolab666.github.io/Dneprfilmcom
          VITE_BASE_PATH: /Dneprfilmcom/
      - name: Commit final coverage changes
        run: |
          rm -f scripts/finish-versioning-coverage.py .github/workflows/finish-versioning-coverage.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Complete CMS Platform 4.0 version coverage"
          git push origin HEAD:feature/cms-platform-4
