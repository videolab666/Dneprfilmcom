name: One-time localize EN case clients
on:
  push:
    branches: [i18n/complete-public-locales]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[case-client-en]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/complete-public-locales
          fetch-depth: 0
      - name: Patch case client localization
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/context/SiteContentContext.tsx')
          s = p.read_text(encoding='utf-8')
          needle = "      ...c,\n      title: c.title_en || en?.title || translateEnglishValue("
          replacement = "      ...c,\n      client: en?.client || translateEnglishValue(c.client),\n      title: c.title_en || en?.title || translateEnglishValue("
          if needle not in s:
              raise SystemExit('EN case return block not found')
          s = s.replace(needle, replacement, 1)
          p.write_text(s, encoding='utf-8')
          Path('.github/workflows/i18n-case-client.yml').unlink(missing_ok=True)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/context/SiteContentContext.tsx .github/workflows
          git commit -m "Localize English case client names [case-client-en]"
          git push origin HEAD:i18n/complete-public-locales
