name: One-time wire public English overrides
on:
  push:
    branches: [i18n/complete-public-locales]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[wire-public-en]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/complete-public-locales
          fetch-depth: 0
      - name: Wire overrides and fix raw locale branches
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          # 1. Apply the shared override dictionary after the base legacy map is declared.
          p = Path('src/locales/legacyEnglish.ts')
          s = p.read_text(encoding='utf-8')
          if "PUBLIC_EN_OVERRIDES" not in s:
              s = s.replace("import type { Locale } from '../types';\n", "import type { Locale } from '../types';\nimport { PUBLIC_EN_OVERRIDES } from './publicEnglishOverrides';\n", 1)
              s = s.replace("\nexport function translateEnglishValue<T>(value: T): T {", "\nObject.assign(LEGACY_EN_TRANSLATIONS, PUBLIC_EN_OVERRIDES);\n\nexport function translateEnglishValue<T>(value: T): T {", 1)
          p.write_text(s, encoding='utf-8')

          # 2. LIVE configurator still had two raw UA/RU branches that bypassed l()/legacy().
          p = Path('src/pages/LiveProduction.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const { isUk, l, legacy } = useSiteContent();", "const { isUk, isEn, l, legacy } = useSiteContent();", 1)
          old = '''{isUk 
                      ? `${cameraCount} ${cameraCount === 1 ? 'камера' : cameraCount < 5 ? 'камери' : 'камер'}`
                      : `${cameraCount} ${cameraCount === 1 ? 'камера' : cameraCount < 5 ? 'камеры' : 'камер'}`
                    }'''
          new = '''{isEn
                      ? `${cameraCount} ${cameraCount === 1 ? 'camera' : 'cameras'}`
                      : isUk
                        ? `${cameraCount} ${cameraCount === 1 ? 'камера' : cameraCount < 5 ? 'камери' : 'камер'}`
                        : `${cameraCount} ${cameraCount === 1 ? 'камера' : cameraCount < 5 ? 'камеры' : 'камер'}`
                    }'''
          if old not in s:
              raise SystemExit('LIVE camera count branch not found')
          s = s.replace(old, new, 1)
          old = '''{(isUk 
                    ? ['Київ', 'Дніпро', 'Львів', 'Одеса', 'Інше'] 
                    : ['Киев', 'Днепр', 'Львов', 'Одесса', 'Другой']
                  ).map((loc) => ('''
          new = '''{(isEn
                    ? ['Kyiv', 'Dnipro', 'Lviv', 'Odesa', 'Other']
                    : isUk
                      ? ['Київ', 'Дніпро', 'Львів', 'Одеса', 'Інше']
                      : ['Киев', 'Днепр', 'Львов', 'Одесса', 'Другой']
                  ).map((loc) => ('''
          if old not in s:
              raise SystemExit('LIVE city branch not found')
          s = s.replace(old, new, 1)
          s = s.replace('>Starlink + Multi-SIM бондинг</div>', '>{l("Starlink + Multi-SIM бондинг", "Starlink + Multi-SIM бондинг", "Starlink + Multi-SIM bonding")}</div>', 1)
          p.write_text(s, encoding='utf-8')

          # 3. Contacts service selector was a raw isUk ternary, making EN render Russian.
          p = Path('src/pages/Contacts.tsx')
          s = p.read_text(encoding='utf-8')
          service_pattern = re.compile(r'''\{isUk \? \(\s*<>\s*<option value="LIVE">LIVE Пряма трансляція.*?</>\s*\) : \(\s*<>\s*<option value="LIVE">LIVE Прямая трансляция.*?</>\s*\)\}''', re.S)
          service_replacement = '''<>
                            <option value="LIVE">{l("LIVE Пряма трансляція (спорт, форум, шоу)", "LIVE Прямая трансляция (спорт, форум, шоу)", "LIVE Broadcast (sports, forum, show)")}</option>
                            <option value="VIDEO">{l("Іміджевий корпоративний фільм / промо", "Имиджевый корпоративный фильм / промо", "Corporate brand film / promo")}</option>
                            <option value="CONSTRUCTION">{l("Моніторинг будівництва / 4K таймлапс", "Мониторинг строительства / 4K таймлапс", "Construction monitoring / 4K timelapse")}</option>
                            <option value="DRONE">{l("Аерозйомка & FPV-прольоти цехів", "Аэросъемка & FPV-пролеты цехов", "Aerial filming & FPV factory fly-throughs")}</option>
                            <option value="COMMERCIAL">{l("Реклама продукту / фуд-відео", "Реклама продукта / фуд-видео", "Product advertising / food video")}</option>
                            <option value="PHOTO">{l("Репортажна або студійна фотозйомка", "Репортажная или студийная фотосъемка", "Event or studio photography")}</option>
                            <option value="FULL_PACKAGE">{l("Комплексний медіа-пакет під ключ", "Комплексный медиа-пакет под ключ", "Turnkey full media package")}</option>
                          </>'''
          s, n = service_pattern.subn(service_replacement, s, count=1)
          if n != 1:
              raise SystemExit(f'Contacts service selector replacement count={n}')
          p.write_text(s, encoding='utf-8')

          # 4. Media Center categories were selected with isUk, so EN always fell through to RU.
          p = Path('src/pages/MediaCenter.tsx')
          s = p.read_text(encoding='utf-8')
          s = s.replace("const categories: Array<{ id: ArticleCategory | 'all'; ru: string; uk: string }> = [", "const categories: Array<{ id: ArticleCategory | 'all'; ru: string; uk: string; en: string }> = [", 1)
          replacements = {
              "{ id: 'all', ru: 'Все статьи', uk: 'Усі статті' },": "{ id: 'all', ru: 'Все статьи', uk: 'Усі статті', en: 'All articles' },",
              "{ id: 'live', ru: 'LIVE & Стриминг', uk: 'LIVE & Стрімінг' },": "{ id: 'live', ru: 'LIVE & Стриминг', uk: 'LIVE & Стрімінг', en: 'LIVE & Streaming' },",
              "{ id: 'video', ru: 'Видеопроизводство', uk: 'Відеовиробництво' },": "{ id: 'video', ru: 'Видеопроизводство', uk: 'Відеовиробництво', en: 'Video Production' },",
              "{ id: 'construction', ru: 'Стройка & Таймлапс', uk: 'Будівництво & Таймлапс' },": "{ id: 'construction', ru: 'Стройка & Таймлапс', uk: 'Будівництво & Таймлапс', en: 'Construction & Timelapse' },",
              "{ id: 'photo', ru: 'Фото', uk: 'Фото' },": "{ id: 'photo', ru: 'Фото', uk: 'Фото', en: 'Photography' },",
              "{ id: 'tech', ru: 'Технологии', uk: 'Технології' },": "{ id: 'tech', ru: 'Технологии', uk: 'Технології', en: 'Technology' },",
          }
          for old, new in replacements.items():
              if old in s:
                  s = s.replace(old, new, 1)
          s = s.replace("{isUk ? category.uk : category.ru}", "{locale === 'en' ? category.en : isUk ? category.uk : category.ru}")
          p.write_text(s, encoding='utf-8')

          Path('.github/workflows/i18n-wire-public-overrides.yml').unlink(missing_ok=True)
          PY
      - name: Typecheck and commit
        run: |
          bun install --frozen-lockfile
          bun run lint
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src .github/workflows
          git commit -m "Wire remaining public English overrides [wire-public-en]"
          git push origin HEAD:i18n/complete-public-locales
