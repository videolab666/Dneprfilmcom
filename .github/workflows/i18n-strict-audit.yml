# Final strict audit after source-level public-English fixes.
name: Temporary strict EN locale audit

on:
  push:
    branches:
      - i18n/complete-public-locales

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - name: Static English coverage inventory
        run: bunx tsx scripts/audit-en-coverage.ts
      - run: bun run build
        env:
          VITE_BASE_PATH: /Dneprfilmcom/
      - name: Audit rendered English pages
        env:
          VITE_BASE_PATH: /Dneprfilmcom/
        run: |
          set -euo pipefail
          bun run preview -- --host 127.0.0.1 --port 4173 >/tmp/preview.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in {1..30}; do
            curl -fsS http://127.0.0.1:4173/Dneprfilmcom/ >/dev/null && break
            sleep 1
          done
          CHROME=''
          for c in google-chrome google-chrome-stable chromium chromium-browser; do
            if command -v "$c" >/dev/null 2>&1; then CHROME="$(command -v "$c")"; break; fi
          done
          test -n "$CHROME"
          routes=('' 'live' 'video' 'construction' 'photo' 'cases' 'media-center' 'about' 'contacts' 'does-not-exist')
          failed=0
          for route in "${routes[@]}"; do
            url="http://127.0.0.1:4173/Dneprfilmcom/${route}?lang=en"
            echo "Auditing $url"
            "$CHROME" --headless=new --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=7000 --dump-dom "$url" > /tmp/en.html 2>/tmp/chrome.log || true
            if ! ROUTE="$route" python3 - <<'PY'
          import html as h, os, re, sys
          src=open('/tmp/en.html',encoding='utf-8').read()
          m=re.search(r'<body[^>]*>(.*?)</body>',src,re.I|re.S)
          body=m.group(1) if m else src
          body=re.sub(r'<script\b[^>]*>.*?</script>',' ',body,flags=re.I|re.S)
          body=re.sub(r'<style\b[^>]*>.*?</style>',' ',body,flags=re.I|re.S)
          text=h.unescape(re.sub(r'<[^>]+>',' ',body))
          text=re.sub(r'\s+',' ',text).strip()
          pat=re.compile(r'[А-Яа-яЁёІіЇїЄєҐґ]')
          hits=list(pat.finditer(text))
          if hits:
              route=os.environ.get('ROUTE') or '/'
              print(f'CYRILLIC_REMAINS /{route}')
              shown=[]
              last_end=-1
              for hit in hits:
                  if hit.start() < last_end:
                      continue
                  start=max(0, hit.start()-100)
                  end=min(len(text), hit.start()+320)
                  snippet=text[start:end].strip()
                  shown.append(snippet)
                  print(' -',snippet)
                  last_end=end
                  if len(shown)>=24: break
              sys.exit(1)
          print('OK', '/' + (os.environ.get('ROUTE') or ''))
          PY
            then
              failed=1
            fi
          done
          exit "$failed"
