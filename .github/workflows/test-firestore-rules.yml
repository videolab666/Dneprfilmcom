name: Test Firebase Rules

on:
  push:
    branches:
      - main
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - src/lib/firebase.ts
      - src/lib/mediaUpload.ts
      - scripts/test-firestore-rules.mjs
      - scripts/test-storage-rules.mjs
      - .github/workflows/test-firestore-rules.yml
  pull_request:
    branches:
      - main
    paths:
      - firestore.rules
      - storage.rules
      - firebase.json
      - src/lib/firebase.ts
      - src/lib/mediaUpload.ts
      - scripts/test-firestore-rules.mjs
      - scripts/test-storage-rules.mjs
      - .github/workflows/test-firestore-rules.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install app dependencies
        run: bun install --frozen-lockfile

      - name: Install rules test helper
        run: bun add --dev --exact @firebase/rules-unit-testing@5.0.2

      - name: Run Firebase emulator regression tests
        run: >-
          bunx firebase-tools emulators:exec
          --only firestore,storage
          --project gen-lang-client-0973206519
          "bun scripts/test-firestore-rules.mjs && bun scripts/test-storage-rules.mjs"
