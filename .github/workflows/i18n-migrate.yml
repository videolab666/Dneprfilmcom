name: One-time public i18n migration

on:
  push:
    branches:
      - i18n/complete-public-locales

permissions:
  contents: write

jobs:
  migrate:
    if: ${{ !contains(github.event.head_commit.message, '[i18n-migrated]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: i18n/complete-public-locales
          fetch-depth: 0
      - name: Apply codemod
        run: python3 scripts/apply_public_i18n.py
      - name: Remove temporary migration files
        run: |
          rm -f .github/workflows/i18n-audit.yml
          rm -f .github/workflows/i18n-migrate.yml
          rm -f scripts/apply_public_i18n.py
          rmdir scripts 2>/dev/null || true
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Complete public locale plumbing [i18n-migrated]"
          git push origin HEAD:i18n/complete-public-locales
