name: Apply CMS cleanup

on:
  push:
    branches:
      - feature/cleanup-seo-actions
    paths:
      - scripts/cleanup_cms_migration.py
      - .github/workflows/apply-cleanup.yml

permissions:
  contents: write

jobs:
  transform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/cleanup-seo-actions

      - name: Apply cleanup
        run: python3 scripts/cleanup_cms_migration.py

      - name: Remove one-time migration files
        run: |
          rm scripts/cleanup_cms_migration.py
          rm .github/workflows/apply-cleanup.yml

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove migrated hardcoded page content"
          git push
