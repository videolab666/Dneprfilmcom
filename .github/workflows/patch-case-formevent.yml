name: One-time patch case FormEvent imports

on:
  push:
    branches:
      - feature/full-case-media-portfolio

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/full-case-media-portfolio
      - name: Patch type imports
        run: |
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src/components/admin/CasesManager.tsx': (
                  "import { useEffect, useMemo, useRef, useState } from 'react';",
                  "import { useEffect, useMemo, useRef, useState, type FormEvent } from 'react';",
              ),
              'src/pages/CaseDetail.tsx': (
                  "import { useEffect, useMemo, useState } from 'react';",
                  "import { useEffect, useMemo, useState, type FormEvent } from 'react';",
              ),
              'src/pages/Cases.tsx': (
                  "import { useEffect, useMemo, useState } from 'react';",
                  "import { useEffect, useMemo, useState, type FormEvent } from 'react';",
              ),
          }
          for filename, (old, new) in replacements.items():
              path = Path(filename)
              text = path.read_text()
              if old not in text:
                  raise SystemExit(f'Missing expected import in {filename}')
              text = text.replace(old, new, 1).replace('React.FormEvent', 'FormEvent')
              path.write_text(text)
          PY
          rm .github/workflows/patch-case-formevent.yml
      - name: Commit patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/components/admin/CasesManager.tsx src/pages/CaseDetail.tsx src/pages/Cases.tsx .github/workflows/patch-case-formevent.yml
          git commit -m "Fix case form event type imports"
          git push origin HEAD:feature/full-case-media-portfolio
