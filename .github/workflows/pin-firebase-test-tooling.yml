name: One-time pin Firebase test tooling

on:
  push:
    branches:
      - chore/pin-firebase-test-tooling

permissions:
  contents: write

jobs:
  pin:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: chore/pin-firebase-test-tooling

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install existing dependencies
        run: bun install --frozen-lockfile

      - name: Pin Firebase rule-test tooling
        run: bun add --dev --exact @firebase/rules-unit-testing@5.0.2 firebase-tools@15.30.0

      - name: Commit pinned package metadata
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package.json bun.lock
          git commit -m "Pin Firebase rules test tooling"
          git push origin HEAD:chore/pin-firebase-test-tooling
