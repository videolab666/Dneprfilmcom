name: Apply dependency cleanup

on:
  push:
    branches:
      - feature/dependency-cleanup
    paths:
      - scripts/apply_dependency_cleanup.py
      - .github/workflows/apply-dependency-cleanup.yml

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feature/dependency-cleanup

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install current dependencies
        run: bun install --frozen-lockfile

      - name: Remove unused runtime dependencies
        run: bun remove @google/genai date-fns dotenv express

      - name: Remove unused development dependencies
        run: bun remove --dev autoprefixer esbuild @types/express

      - name: Remove unused source exports
        run: python3 scripts/apply_dependency_cleanup.py

      - name: Remove one-time cleanup files
        run: |
          rm scripts/apply_dependency_cleanup.py
          rm .github/workflows/apply-dependency-cleanup.yml

      - name: Verify typecheck and production build
        run: |
          bun run lint
          VITE_BASE_PATH=/Dneprfilmcom/ bun run build

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove unused template dependencies and exports"
          git push
